
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Wedding of Yulva Sulistia, S.E & Musliadi, S.T</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #eeeae4;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: 'Montserrat', sans-serif;
}

.invitation {
    width: 100%;
    max-width: 460px;
    min-height: 680px;
    background: #fffefa;
    position: relative;
    overflow: hidden;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.12);
}

.content {
    position: relative;
    z-index: 3;
    padding: 180px 25px 55px;
}

/* ORNAMEN */
.flower-top {
    position: absolute;
    width: 100%;
    height: 250px;
    top: 0;
    left: 0;
    z-index: 2;
    pointer-events: none;
}

.flower-left,
.flower-right {
    position: absolute;
    width: 115px;
    height: 370px;
    top: 100px;
    z-index: 2;
    pointer-events: none;
}

.flower-left {
    left: 0;
}

.flower-right {
    right: 0;
    transform: scaleX(-1);
}

/* JUDUL */
.small-title {
    font-family: 'Great Vibes', cursive;
    font-size: 30px;
    color: #59664f;
    margin-bottom: 8px;
    font-weight: 400;
}

.subtitle {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    color: #59644f;
    margin-bottom: 27px;
}

/* NAMA PENGANTIN */
.couple-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 48px;
    line-height: 1.05;
    letter-spacing: 5px;
    font-weight: 700;
    color: #354437;
    text-transform: uppercase;
}

.couple-lastname {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 4px;
    color: #606b59;
    margin-top: 9px;
}

.ampersand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 35px;
    font-style: italic;
    font-weight: 600;
    color: #a17d68;
    margin: 13px 0;
}

/* KALIMAT UNDANGAN */
.invite-text {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-style: italic;
    font-size: 20px;
    color: #555e50;
    margin-top: 28px;
    margin-bottom: 30px;
}

/* NAMA TAMU */
.guest-section {
    margin-top: 12px;
}

.guest-label {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    color: #65705d;
    margin-bottom: 12px;
}

.guest-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 34px;
    font-weight: 700;
    line-height: 1.2;
    color: #354437;
    overflow-wrap: anywhere;
    padding: 0 10px;
}

.guest-line {
    width: 80px;
    height: 2px;
    background: #b89b7c;
    margin: 17px auto;
}

.guest-description {
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    font-weight: 500;
    font-style: italic;
    color: #626957;
    line-height: 1.5;
}

/* TOMBOL */
.open-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 32px;
    padding: 16px 32px;
    background: #68795f;
    border: 1px solid #68795f;
    border-radius: 4px;
    color: #ffffff;
    text-decoration: none;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(80,95,75,0.2);
}

.open-button:hover {
    background: #4d6048;
    border-color: #4d6048;
    color: #ffffff;
    transform: translateY(-3px);
}

.open-button svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    display: block;
    stroke: currentColor;
    stroke-width: 1.8;
}

/* FOOTER */
.footer {
    font-family: 'Great Vibes', cursive;
    font-size: 27px;
    font-weight: 400;
    color: #68795f;
    margin-top: 28px;
}

/* RESPONSIVE HP */
@media (max-width: 480px) {

    body {
        padding: 10px;
    }

    .invitation {
        min-height: 680px;
    }

    .content {
        padding: 175px 18px 45px;
    }

    .flower-top {
        height: 220px;
    }

    .flower-left,
    .flower-right {
        width: 90px;
        height: 330px;
    }

    .small-title {
        font-size: 27px;
    }

    .subtitle {
        font-size: 9px;
        letter-spacing: 2.5px;
    }

    .couple-name {
        font-size: 40px;
        letter-spacing: 4px;
    }

    .couple-lastname {
        font-size: 10px;
    }

    .invite-text {
        font-size: 18px;
    }

    .guest-name {
        font-size: 30px;
    }

    .guest-description {
        font-size: 17px;
    }

    .open-button {
        padding: 15px 26px;
        font-size: 10px;
        gap: 9px;
    }

    .open-button svg {
        width: 15px;
        height: 15px;
    }
}

</style>
</head>

<body>

<div class="invitation">

    <!-- BUNGA BAGIAN ATAS -->

         preserveAspectRatio="xMidYMin slice"
         xmlns="http://www.w3.org/2000/svg">

                <ellipse cx="0" cy="0" rx="7" ry="19"

        <g fill="none" stroke="#738b71" stroke-width="2">

        <g>

            <use href="#pinkflower" x="310" y="45"/>
            <use href="#pinkflower" x="365" y="100"/>
            <use href="#pinkflower" x="425" y="45"/>
            <use href="#pinkflower" x="395" y="165"/>
        </g>

        <!-- BUNGA KECIL -->
        <g fill="#efd8d1">
            <circle cx="45" cy="135" r="4"/>
            <circle cx="90" cy="35" r="4"/>
            <circle cx="180" cy="35" r="4"/>
            <circle cx="235" cy="155" r="4"/>
            <circle cx="285" cy="85" r="4"/>
            <circle cx="345" cy="35" r="4"/>
            <circle cx="440" cy="125" r="4"/>
        </g>

    </svg>


    <!-- BUNGA SISI KIRI -->
    <svg class="flower-left" viewBox="0 0 120 370"
         xmlns="http://www.w3.org/2000/svg">

        <path d="M10 0 Q65 80 25 180 Q5 260 55 360"
              fill="none" stroke="#84977c" stroke-width="2"/>

        <g fill="#78977d">
            <ellipse cx="30" cy="65" rx="8" ry="22" transform="rotate(-45 30 65)"/>
            <ellipse cx="65" cy="110" rx="8" ry="22" transform="rotate(45 65 110)"/>
            <ellipse cx="25" cy="175" rx="8" ry="22" transform="rotate(-45 25 175)"/>
            <ellipse cx="45" cy="240" rx="8" ry="22" transform="rotate(45 45 240)"/>
            <ellipse cx="50" cy="315" rx="8" ry="22" transform="rotate(-45 50 315)"/>
        </g>

        <g fill="#e9c6c2">
            <circle cx="20" cy="95" r="10"/>
            <circle cx="36" cy="95" r="10"/>
            <circle cx="28" cy="80" r="10"/>
            <circle cx="28" cy="108" r="10"/>
            <circle cx="28" cy="95" r="5"/>

            <circle cx="55" cy="205" r="9"/>
            <circle cx="70" cy="205" r="9"/>

            <circle cx="63" cy="219" r="9"/>
            <circle cx="63" cy="205" r="4"/>
        </g>
    </svg>


    <!-- BUNGA SISI KANAN -->
    <svg class="flower-right" viewBox="0 0 120 370"
         xmlns="http://www.w3.org/2000/svg">

        <path d="M10 0 Q65 80 25 180 Q5 260 55 360"
              fill="none" stroke="#84977c" stroke-width="2"/>

        <g fill="#78977d">
            <ellipse cx="30" cy="65" rx="8" ry="22" transform="rotate(-45 30 65)"/>
            <ellipse cx="65" cy="110" rx="8" ry="22" transform="rotate(45 65 110)"/>
            <ellipse cx="25" cy="175" rx="8" ry="22" transform="rotate(-45 25 175)"/>
            <ellipse cx="45" cy="240" rx="8" ry="22" transform="rotate(45 45 240)"/>
            <ellipse cx="50" cy="315" rx="8" ry="22" transform="rotate(-45 50 315)"/>
        </g>

        <g fill="#e9c6c2">
            <circle cx="20" cy="95" r="10"/>
            <circle cx="36" cy="95" r="10"/>
            <circle cx="28" cy="80" r="10"/>
            <circle cx="28" cy="108" r="10"/>
            <circle cx="28" cy="95" r="5"/>

            <circle cx="55" cy="205" r="9"/>
            <circle cx="70" cy="205" r="9"/>
            <circle cx="63" cy="191" r="9"/>
            <circle cx="63" cy="219" r="9"/>
            <circle cx="63" cy="205" r="4"/>

<!-- KONTEN UNDANGAN -->
<div class="content">

    <p class="small-title">
        Together
    </p>

    <h1 class="couple-name">
        Yulva Sulistia, S.E
    </h1>

    <div class="ampersand">&</div>

    <h1 class="couple-name">
        Musliadi, S.T
    </h1>

    <p class="invite-text">
        Invite you to Our wedding
    </p>

    <!-- NAMA TAMU -->
    <div class="guest-section">

        <p class="guest-label">
            DEAR
        </p>

        <div class="guest-name" id="guestName">
            Tamu Undangan
        </div>

        <div class="guest-line"></div>

        <p class="guest-description">
            It would be our pleasure<br>
            to have you celebrate with us
        </p>

    </div>

    <!-- TOMBOL BUKA UNDANGAN -->
    <a href="main.html" class="open-button">

        <svg viewBox="0 0 24 24"
             fill="none"
             xmlns="http://www.w3.org/2000/svg">

            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 7L12 13L21 7"/>

        </svg>

        <span>BUKA UNDANGAN</span>

    </a>

    <p class="footer">
        With Love
    </p>

</div>
</div>




<script>
    // Mengambil parameter nama tamu dari link
    const params = new URLSearchParams(window.location.search);

    // Membaca nama tamu
    const guest = params.get("to");

    // Menampilkan nama tamu secara otomatis
    const guestName = document.getElementById("guestName");

    if (guestName) {
        guestName.textContent = guest
            ? guest.replace(/\+/g, " ").trim()
            : "Tamu Undangan";
    }
</script>


</body>
</html>
