
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Wedding of Yulva & Musliadi</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #eeeae4;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: 'Montserrat', sans-serif;
}

/* HALAMAN UNDANGAN */
.invitation {
    width: 100%;
    max-width: 460px;
    min-height: 680px;
    background: #fffefa;
    position: relative;
    overflow: hidden;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.10);
}

/* AREA KONTEN */
.content {
    position: relative;
    z-index: 3;
    padding: 180px 25px 65px;
}

/* ORNAMEN BUNGA */
.flower-top {
    position: absolute;
    width: 100%;
    height: 250px;
    top: 0;
    left: 0;
    z-index: 2;
    pointer-events: none;
}

.flower-left {
    position: absolute;
    width: 115px;
    height: 370px;
    left: 0;
    top: 100px;
    z-index: 2;
    pointer-events: none;
}

.flower-right {
    position: absolute;
    width: 115px;
    height: 370px;
    right: 0;
    top: 100px;
    transform: scaleX(-1);
    z-index: 2;
    pointer-events: none;
}

/* TEKS */
.small-title {
    font-family: 'Great Vibes', cursive;
    font-size: 25px;
    color: #7e8172;
    margin-bottom: 5px;
}

.subtitle {
    font-size: 9px;
    letter-spacing: 3px;
    color: #858477;
    margin-bottom: 25px;
}

.couple-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 43px;
    line-height: 1;
    letter-spacing: 7px;
    font-weight: 600;
    color: #343b36;
    text-transform: uppercase;
}

.couple-lastname {
    font-size: 13px;
    letter-spacing: 5px;
    color: #656b62;
    margin-top: 7px;
}

.ampersand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    font-style: italic;
    color: #a78d7a;
    margin: 13px 0;
}

.invite-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    letter-spacing: 1px;
    color: #74776d;
    margin-top: 27px;
    margin-bottom: 27px;
}

/* NAMA TAMU */
.guest-section {
    margin-top: 10px;
}

.guest-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: #888779;
    margin-bottom: 12px;
}

.guest-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    font-weight: 600;
    color: #414c42;
    overflow-wrap: anywhere;
    padding: 0 10px;
}

.guest-line {
    width: 75px;
    height: 1px;
    background: #c4ad9b;
    margin: 15px auto;
}

.guest-description {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-style: italic;
    color: #858477;
    line-height: 1.5;
}

/* TOMBOL BUKA UNDANGAN */
.open-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;

    margin-top: 30px;
    padding: 15px 32px;

    background: #87917e;
    border: 1px solid #87917e;
    border-radius: 3px;

    color: #ffffff;
    text-decoration: none;

    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;

    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(80, 95, 75, 0.18);
}

/* EFEK HOVER */
.open-button:hover {
    background: #6f7c68;
    border-color: #6f7c68;
    color: #ffffff;
    transform: translateY(-3px);
    box-shadow: 0 7px 18px rgba(80, 95, 75, 0.25);
}

/* IKON AMPLOP */
.open-button svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    display: block;
    stroke: currentColor;
    stroke-width: 1.8;
}

/* FOOTER */
.footer {
    font-family: 'Great Vibes', cursive;
    font-size: 23px;
    color: #a18c79;
    margin-top: 28px;
}

/* RESPONSIVE HP */
@media (max-width: 480px) {

    body {
        padding: 10px;
    }

    .invitation {
        min-height: 680px;
    }

    .content {
        padding-top: 180px;
        padding-left: 18px;
        padding-right: 18px;
    }

    .flower-top {
        height: 220px;
    }

    .flower-left,
    .flower-right {
        width: 90px;
        height: 330px;
    }

    .couple-name {
        font-size: 37px;
        letter-spacing: 5px;
    }

    .guest-name {
        font-size: 27px;
    }

    .open-button {
        padding: 14px 27px;
        font-size: 10px;
        gap: 9px;
    }

    .open-button svg {
        width: 14px;
        height: 14px;
    }
}
</style>
</head>

<body>

<div class="invitation">

    <!-- BUNGA BAGIAN ATAS -->
    <svg class="flower-top" viewBox="0 0 460 250"
         preserveAspectRatio="xMidYMin slice"
         xmlns="http://www.w3.org/2000/svg">

        <defs>
            <g id="leaf">
                <ellipse cx="0" cy="0" rx="7" ry="19"
                         fill="#78947b"
                         transform="rotate(35)"/>
                <path d="M0 0 Q0 -10 0 -18"
                      stroke="#d1e0ca" fill="none"/>
            </g>

            <g id="pinkflower">
                <ellipse cx="0" cy="-9" rx="5" ry="11" fill="#e8c5c2"/>
                <ellipse cx="9" cy="0" rx="5" ry="11" fill="#f0d5d0" transform="rotate(90 9 0)"/>
                <ellipse cx="0" cy="9" rx="5" ry="11" fill="#e8c5c2"/>
                <ellipse cx="-9" cy="0" rx="5" ry="11" fill="#f5ddd7" transform="rotate(90 -9 0)"/>
                <circle cx="0" cy="0" r="4" fill="#c5a17c"/>
            </g>
        </defs>

        <!-- CABANG -->
        <g fill="none" stroke="#738b71" stroke-width="2">
            <path d="M-10 0 Q60 65 100 160 Q130 195 165 210"/>
            <path d="M100 0 Q150 70 190 135 Q220 170 250 190"/>
            <path d="M260 0 Q280 65 310 120 Q335 160 365 180"/>
            <path d="M460 0 Q390 65 370 120 Q345 160 330 205"/>
            <path d="M190 0 Q205 65 225 115"/>
        </g>

        <!-- DAUN -->
        <g>
            <use href="#leaf" x="42" y="60" transform="rotate(-50 42 60)"/>
            <use href="#leaf" x="65" y="90" transform="rotate(55 65 90)"/>
            <use href="#leaf" x="100" y="115" transform="rotate(-50 100 115)"/>
            <use href="#leaf" x="125" y="150" transform="rotate(50 125 150)"/>
            <use href="#leaf" x="175" y="90" transform="rotate(-45 175 90)"/>
            <use href="#leaf" x="205" y="130" transform="rotate(50 205 130)"/>
            <use href="#leaf" x="300" y="75" transform="rotate(-50 300 75)"/>
            <use href="#leaf" x="325" y="115" transform="rotate(45 325 115)"/>
            <use href="#leaf" x="380" y="80" transform="rotate(-55 380 80)"/>
            <use href="#leaf" x="405" y="125" transform="rotate(45 405 125)"/>
        </g>

        <!-- BUNGA -->
        <g>
            <use href="#pinkflower" x="25" y="40"/>
            <use href="#pinkflower" x="75" y="110"/>
            <use href="#pinkflower" x="120" y="65"/>
            <use href="#pinkflower" x="155" y="155"/>
            <use href="#pinkflower" x="215" y="60"/>
            <use href="#pinkflower" x="260" y="130"/>
            <use href="#pinkflower" x="310" y="45"/>
            <use href="#pinkflower" x="365" y="100"/>
            <use href="#pinkflower" x="425" y="45"/>
            <use href="#pinkflower" x="395" y="165"/>
        </g>

        <!-- BUNGA KECIL -->
        <g fill="#efd8d1">
            <circle cx="45" cy="135" r="4"/>
            <circle cx="90" cy="35" r="4"/>
            <circle cx="180" cy="35" r="4"/>
            <circle cx="235" cy="155" r="4"/>
            <circle cx="285" cy="85" r="4"/>
            <circle cx="345" cy="35" r="4"/>
            <circle cx="440" cy="125" r="4"/>
        </g>

    </svg>


    <!-- BUNGA SISI KIRI -->
    <svg class="flower-left" viewBox="0 0 120 370"
         xmlns="http://www.w3.org/2000/svg">

        <path d="M10 0 Q65 80 25 180 Q5 260 55 360"
              fill="none" stroke="#84977c" stroke-width="2"/>

        <g fill="#78977d">
            <ellipse cx="30" cy="65" rx="8" ry="22" transform="rotate(-45 30 65)"/>
            <ellipse cx="65" cy="110" rx="8" ry="22" transform="rotate(45 65 110)"/>
            <ellipse cx="25" cy="175" rx="8" ry="22" transform="rotate(-45 25 175)"/>
            <ellipse cx="45" cy="240" rx="8" ry="22" transform="rotate(45 45 240)"/>
            <ellipse cx="50" cy="315" rx="8" ry="22" transform="rotate(-45 50 315)"/>
        </g>

        <g fill="#e9c6c2">
            <circle cx="20" cy="95" r="10"/>
            <circle cx="36" cy="95" r="10"/>
            <circle cx="28" cy="80" r="10"/>
            <circle cx="28" cy="108" r="10"/>
            <circle cx="28" cy="95" r="5"/>

            <circle cx="55" cy="205" r="9"/>
            <circle cx="70" cy="205" r="9"/>
            <circle cx="63" cy="191" r="9"/>
            <circle cx="63" cy="219" r="9"/>
            <circle cx="63" cy="205" r="4"/>
        </g>
    </svg>


    <!-- BUNGA SISI KANAN -->
    <svg class="flower-right" viewBox="0 0 120 370"
         xmlns="http://www.w3.org/2000/svg">

        <path d="M10 0 Q65 80 25 180 Q5 260 55 360"
              fill="none" stroke="#84977c" stroke-width="2"/>

        <g fill="#78977d">
            <ellipse cx="30" cy="65" rx="8" ry="22" transform="rotate(-45 30 65)"/>
            <ellipse cx="65" cy="110" rx="8" ry="22" transform="rotate(45 65 110)"/>
            <ellipse cx="25" cy="175" rx="8" ry="22" transform="rotate(-45 25 175)"/>
            <ellipse cx="45" cy="240" rx="8" ry="22" transform="rotate(45 45 240)"/>
            <ellipse cx="50" cy="315" rx="8" ry="22" transform="rotate(-45 50 315)"/>
        </g>

        <g fill="#e9c6c2">
            <circle cx="20" cy="95" r="10"/>
            <circle cx="36" cy="95" r="10"/>
            <circle cx="28" cy="80" r="10"/>
            <circle cx="28" cy="108" r="10"/>
            <circle cx="28" cy="95" r="5"/>

            <circle cx="55" cy="205" r="9"/>
            <circle cx="70" cy="205" r="9"/>
            <circle cx="63" cy="191" r="9"/>
            <circle cx="63" cy="219" r="9"/>
            <circle cx="63" cy="205" r="4"/>
        </g>
    </svg>


    <!-- KONTEN UNDANGAN -->
    <div class="content">

        <p class="small-title">
            Together
        </p>

        <p class="subtitle">
            WITH THEIR FAMILIES
        </p>

        <h1 class="couple-name">
            YULVA
        </h1>

        <p class="couple-lastname">
            & FAMILY
        </p>

        <div class="ampersand">&</div>

        <h1 class="couple-name">
            MUSLIADI
        </h1>

        <p class="couple-lastname">
            & FAMILY
        </p>

        <p class="invite-text">
            Invite you to their wedding
        </p>

        <!-- NAMA TAMU -->
        <div class="guest-section">

            <p class="guest-label">
                DEAR
            </p>

            <div class="guest-name" id="guestName">
                Tamu Undangan
            </div>

            <div class="guest-line"></div>

            <p class="guest-description">
                It would be our pleasure<br>
                to have you celebrate with us
            </p>

        </div>

        <!-- TOMBOL BUKA UNDANGAN -->
        <a href="main.html" class="open-button">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 xmlns="http://www.w3.org/2000/svg">

                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="M3 7L12 13L21 7"/>

            </svg>

            <span>BUKA UNDANGAN</span>

        </a>

        <p class="footer">
            With Love
        </p>

    </div>

</div>


<script>
    // Mengambil nama tamu dari link
    const params = new URLSearchParams(window.location.search);

    const guest = params.get("to");

    // Menampilkan nama tamu secara otomatis
    document.getElementById("guestName").textContent =
        guest ? guest.replace(/\+/g, " ") : "Tamu Undangan";

</script>

</body>
</html>
